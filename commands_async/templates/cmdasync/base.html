{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="{% static "cmdasync/bootstrap-4.6.2/css/bootstrap.min.css" %}">

{% comment %}
Every <script> carries the host project's CSP nonce. Under a nonce-only policy
with 'strict-dynamic' the host allowlist ('self', https:) is ignored for scripts,
so an external file is refused exactly like an inline block. `csp_nonce` comes
from the project's context processor; standalone, or with the CSP off, it is empty
and this renders as a harmless empty attribute.
{% endcomment %}
    <script nonce="{{ csp_nonce }}" src="{% static "cmdasync/js/jquery-3.7.1.min.js" %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static "cmdasync/js/jquery.form.v4.4.2.min.js" %}"></script>

    <title>{% block title %}{% endblock %}</title>
    {% block extrahead %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
{# Bundle: Bootstrap plus the Popper build it expects, in one nonced request. #}
<script nonce="{{ csp_nonce }}" src="{% static "cmdasync/bootstrap-4.6.2/js/bootstrap.bundle.min.js" %}"></script>
</body>
</html>
